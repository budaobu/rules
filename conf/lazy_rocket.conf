# 表示CN地区的IP分流走直连，GEOIP数据库用来判断IP是否属于CN地区。默认使用Shadowrocket自带的GEOIP数据库，如果您想替换其他数据库，可在 设置 - GeoLite2数据库 里添加和修改。
GEOIP,CN,DIRECT

# 英国 VoWiFi / ePDG
# AND,((GEOIP,GB), (AND,((PROTOCOL,UDP), (OR,((DEST-PORT,500), (DEST-PORT,4500)))))),VoWiFi
# 德国 VoWiFi / ePDG
# AND,((GEOIP,DE), (AND,((PROTOCOL,UDP), (OR,((DEST-PORT,500), (DEST-PORT,4500)))))),VoWiFi
# 香港 VoWiFi / ePDG
# AND,((GEOIP,HK), (AND,((PROTOCOL,UDP), (OR,((DEST-PORT,500), (DEST-PORT,4500)))))),VoWiFi
# 美国 VoWiFi / ePDG
AND,((GEOIP,US), (AND,((PROTOCOL,UDP), (OR,((DEST-PORT,500), (DEST-PORT,4500)))))),VoWiFi
# 瑞士 VoWiFi / ePDG
# AND,((GEOIP,CH), (AND,((PROTOCOL,UDP), (OR,((DEST-PORT,500), (DEST-PORT,4500)))))),VoWiFi

# 表示当其他所有规则都匹配不到时才使用FINAL规则的策略。
FINAL,PROXY

