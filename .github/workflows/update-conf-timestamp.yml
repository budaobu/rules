# .github/workflows/update-conf-timestamp.yml
name: Update lazy_rocket.conf timestamp

on:
  push:
    branches: [main]          # 分支名不对的话改这里
    paths:
      - 'conf/lazy_rocket.conf'

permissions:
  contents: write

concurrency:
  group: update-lazy-rocket-conf
  cancel-in-progress: false

jobs:
  update-timestamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump version and refresh timestamp
        run: |
          FILE="conf/lazy_rocket.conf"

          CURRENT=$(grep -oP '^# Version: \K[0-9]+\.[0-9]+\.[0-9]+' "$FILE")
          NEW_VERSION=$(awk -F. -v OFS=. '{$3+=1; print}' <<< "$CURRENT")

          NOW=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S%:z')

          sed -i \
            -e "s/^# Version: .*/# Version: ${NEW_VERSION}/" \
            -e "s/^# Updated: .*/# Updated: ${NOW}/" \
            "$FILE"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add conf/lazy_rocket.conf
          git commit -m "chore: bump lazy_rocket.conf version and timestamp [skip ci]"
          git push
